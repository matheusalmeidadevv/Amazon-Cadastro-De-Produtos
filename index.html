<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produto</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main>
        <!-- Cadastro -->
        <section id="cadastro">
            <form id="cadastroP">
                <h3 id="titulo">Bem-vindo ao sistema de cadastro de um Novo Produto</h3>

                <label for="produto">Digite o nome do produto:</label>
                <input type="text" id="produto" name="nome" required>

                <label for="preco">Digite o preço do produto:</label>
                <input type="number" id="preco" name="valor" min="0" step="0.01" required>

                <label for="validade">Digite a validade do produto:</label>
                <input type="date" id="validade" name="validade" required>

                <label for="categoria">Categoria:</label>
                <select id="categoria" name="categoria">
                    <option value="Eletronicos">Eletrônicos</option>
                    <option value="Perifericos">Periféricos</option>
                </select>

                <button type="submit" id="btn">Salvar</button>
            </form>
        </section>

        <!-- Busca -->
        <section id="pesquisaP">
            <form id="formBusca">
                <input type="text" id="busca" placeholder="Digite o nome do produto que deseja buscar">

                <select id="filtroCategoria" aria-label="Filtrar por categoria">
                    <option value="Todos">Todos</option>
                    <option value="Eletronicos">Eletrônicos</option>
                    <option value="Perifericos">Periféricos</option>
                </select>

                <button type="submit" id="btnBusca">Buscar</button>
            </form>
        </section>

        <!-- Tabela de produtos -->  
        <section id="listaP">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Validade</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <i>Feito por Matheus Almeida</i>
    </footer>

</body>
</html>
